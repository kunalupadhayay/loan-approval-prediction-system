<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI-Based Loan Approval System{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="{{ url_for('index') }}">
      <span class="wordmark-mark">§</span>LoanWise AI
    </a>
    <nav class="site-nav">
      <a href="{{ url_for('index') }}" class="{{ 'is-active' if request.endpoint == 'index' else '' }}">Application</a>
    </nav>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <p>LoanWise AI is a demonstration system. Decisions are generated by a Random Forest model trained on synthetic data — not a real lender.</p>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
